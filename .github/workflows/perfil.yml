name: Atualizar perfil (cobrinha + estatísticas)

on:
  schedule:
    - cron: "0 */12 * * *"   # atualiza a cada 12h
  workflow_dispatch:           # botão "Run workflow"

permissions:
  contents: write

# impede duas execuções simultâneas (causa do erro "git push")
concurrency:
  group: atualizar-perfil
  cancel-in-progress: false

jobs:
  estatisticas:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Gerar cards de estatísticas
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # PROFILE_TOKEN = token pessoal com acesso aos repositórios privados
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: -3

  sequencia:
    needs: estatisticas
    runs-on: ubuntu-24.04
    steps:
      - name: Gerar card de sequência (inclui privados)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PROFILE_TOKEN }}
          filename: metrics.isocalendar.svg
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  cobrinha:
    runs-on: ubuntu-24.04
    steps:
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00D4AA

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
